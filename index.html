<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Repeal Day — Social Performance</title>
<style>
  /* ============ Palette (light default, dark via OS + toggle) ============ */
  :root {
    color-scheme: light;
    --surface-1:      #fcfcfb;
    --surface-2:      #ffffff;
    --page-plane:     #f9f9f7;
    --text-primary:   #0b0b0b;
    --text-secondary: #52514e;
    --text-muted:     #898781;
    --gridline:       #e1e0d9;
    --baseline:       #c3c2b7;
    --border:         rgba(11,11,11,0.10);
    --success:        #006300;
    --critical:       #d03b3b;

    --series-followers: #2a78d6;  /* categorical slot 1 - blue */
    --series-followers-fill: #2a78d61a;
    --series-unfollows: #eb6834;  /* categorical slot 2 - orange */
    --series-cpf:       #1baf7a;  /* categorical slot 3 - aqua */
    --series-cpf-fill:  #1baf7a1a;

    --shadow: 0 1px 2px rgba(11,11,11,0.04), 0 4px 16px rgba(11,11,11,0.05);
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      color-scheme: dark;
      --surface-1:      #1a1a19;
      --surface-2:      #201f1e;
      --page-plane:     #0d0d0d;
      --text-primary:   #ffffff;
      --text-secondary: #c3c2b7;
      --text-muted:     #898781;
      --gridline:       #2c2c2a;
      --baseline:       #383835;
      --border:         rgba(255,255,255,0.10);
      --success:        #0ca30c;
      --critical:       #e66767;

      --series-followers: #3987e5;
      --series-followers-fill: #3987e51f;
      --series-unfollows: #d95926;
      --series-cpf:       #199e70;
      --series-cpf-fill:  #199e701f;
      --shadow: 0 1px 2px rgba(0,0,0,0.3), 0 4px 20px rgba(0,0,0,0.35);
    }
  }
  :root[data-theme="dark"] {
    color-scheme: dark;
    --surface-1:      #1a1a19;
    --surface-2:      #201f1e;
    --page-plane:     #0d0d0d;
    --text-primary:   #ffffff;
    --text-secondary: #c3c2b7;
    --text-muted:     #898781;
    --gridline:       #2c2c2a;
    --baseline:       #383835;
    --border:         rgba(255,255,255,0.10);
    --success:        #0ca30c;
    --critical:       #e66767;

    --series-followers: #3987e5;
    --series-followers-fill: #3987e51f;
    --series-unfollows: #d95926;
    --series-cpf:       #199e70;
    --series-cpf-fill:  #199e701f;
    --shadow: 0 1px 2px rgba(0,0,0,0.3), 0 4px 20px rgba(0,0,0,0.35);
  }

  * { box-sizing: border-box; }
  html, body {
    margin: 0; padding: 0;
    background: var(--page-plane);
    color: var(--text-primary);
    font-family: system-ui, -apple-system, "Segoe UI", sans-serif;
    -webkit-font-smoothing: antialiased;
  }
  body { overflow-x: hidden; }
  img { max-width: 100%; }

  .wrap {
    max-width: 1080px;
    margin: 0 auto;
    padding: 32px 20px 80px;
  }

  /* ---------- Header ---------- */
  header.page-head {
    display: flex;
    align-items: flex-start;
    justify-content: space-between;
    gap: 16px;
    padding-bottom: 24px;
    border-bottom: 1px solid var(--border);
    margin-bottom: 32px;
    flex-wrap: wrap;
  }
  .brand-block .eyebrow {
    font-size: 13px;
    font-weight: 600;
    letter-spacing: 0.06em;
    text-transform: uppercase;
    color: var(--text-muted);
    margin: 0 0 4px;
  }
  .brand-block h1 {
    font-size: 28px;
    font-weight: 700;
    margin: 0 0 6px;
    letter-spacing: -0.01em;
  }
  .brand-block .sub {
    font-size: 14px;
    color: var(--text-secondary);
    margin: 0;
  }
  .as-of {
    font-size: 13px;
    color: var(--text-muted);
    text-align: right;
    white-space: nowrap;
    padding-top: 6px;
  }

  /* ---------- Section shell ---------- */
  section.block { margin-bottom: 48px; }
  .block-title {
    font-size: 12px;
    font-weight: 700;
    letter-spacing: 0.08em;
    text-transform: uppercase;
    color: var(--text-muted);
    margin: 0 0 16px;
  }

  /* ---------- Stat tiles ---------- */
  .kpi-row {
    display: grid;
    grid-template-columns: repeat(4, 1fr);
    gap: 12px;
    margin-bottom: 20px;
  }
  @media (max-width: 720px) {
    .kpi-row { grid-template-columns: repeat(2, 1fr); }
  }
  .stat-tile {
    background: var(--surface-1);
    border: 1px solid var(--border);
    border-radius: 12px;
    padding: 18px 18px 16px;
    box-shadow: var(--shadow);
    min-width: 0;
  }
  .stat-tile .label {
    font-size: 12.5px;
    color: var(--text-secondary);
    margin: 0 0 10px;
    font-weight: 500;
  }
  .stat-tile .value {
    font-size: 28px;
    font-weight: 600;
    line-height: 1.1;
    margin: 0 0 8px;
    font-variant-numeric: proportional-nums;
  }
  .stat-tile .delta {
    font-size: 13px;
    font-weight: 600;
    display: inline-flex;
    align-items: center;
    gap: 4px;
  }
  .stat-tile .delta.up { color: var(--success); }
  .stat-tile .delta.down { color: var(--critical); }
  .stat-tile .delta-period {
    color: var(--text-muted);
    font-weight: 400;
    margin-left: 2px;
  }

  /* ---------- Chart cards ---------- */
  .chart-grid {
    display: grid;
    grid-template-columns: 1fr;
    gap: 12px;
  }
  .chart-card {
    background: var(--surface-1);
    border: 1px solid var(--border);
    border-radius: 12px;
    padding: 18px 18px 14px;
    box-shadow: var(--shadow);
    min-width: 0;
  }
  .chart-card .chart-title {
    font-size: 14px;
    font-weight: 600;
    margin: 0 0 2px;
  }
  .chart-card .chart-sub {
    font-size: 12px;
    color: var(--text-muted);
    margin: 0 0 12px;
  }
  .chart-legend {
    display: flex;
    flex-wrap: wrap;
    column-gap: 16px;
    row-gap: 6px;
    margin: 0 0 14px;
  }
  .chart-legend .legend-item {
    display: inline-flex;
    align-items: center;
    gap: 6px;
    font-size: 12px;
    color: var(--text-secondary);
  }
  .chart-legend .legend-item .swatch {
    width: 14px;
    height: 2px;
    border-radius: 1px;
    display: inline-block;
    flex: none;
  }
  .chart-legend .legend-item .swatch-bar {
    width: 10px;
    height: 10px;
    border-radius: 2px;
    display: inline-block;
    flex: none;
  }
  .mini-table-label {
    font-size: 11px;
    font-weight: 700;
    letter-spacing: 0.05em;
    text-transform: uppercase;
    color: var(--text-muted);
    margin: 18px 0 4px;
  }
  .chart-scroll {
    overflow-x: auto;
    overflow-y: hidden;
    min-width: 0;
    position: relative;
  }
  .chart-scroll svg { display: block; }
  .scroll-hint {
    position: absolute;
    top: 0; right: 0; bottom: 0;
    width: 36px;
    background: linear-gradient(to right, transparent, var(--surface-1) 85%);
    display: none;
    align-items: center;
    justify-content: flex-end;
    font-size: 14px;
    color: var(--text-muted);
    pointer-events: none;
  }
  .scroll-hint.show { display: flex; }

  .chart-foot {
    display: flex;
    justify-content: flex-end;
    margin-top: 6px;
  }
  .table-toggle {
    font-size: 12px;
    color: var(--text-secondary);
    background: none;
    border: none;
    padding: 4px 2px;
    cursor: pointer;
    text-decoration: underline;
    text-underline-offset: 2px;
  }
  .table-toggle:hover { color: var(--text-primary); }

  .table-scroll {
    overflow-x: auto;
    min-width: 0;
  }
  .table-scroll .data-table {
    width: auto;
    min-width: 480px;
  }
  .data-table {
    width: 100%;
    border-collapse: collapse;
    font-size: 12.5px;
    margin-top: 10px;
    display: none;
  }
  .data-table.open { display: table; }
  .data-table th, .data-table td {
    text-align: right;
    padding: 6px 8px;
    border-bottom: 1px solid var(--gridline);
    font-variant-numeric: tabular-nums;
    white-space: nowrap;
  }
  .data-table th:first-child, .data-table td:first-child { text-align: left; }
  .data-table th {
    color: var(--text-muted);
    font-weight: 600;
    font-size: 11px;
    text-transform: uppercase;
    letter-spacing: 0.03em;
  }

  /* tooltip */
  .chart-tooltip {
    position: absolute;
    pointer-events: none;
    background: var(--surface-2);
    border: 1px solid var(--border);
    border-radius: 8px;
    padding: 8px 10px;
    font-size: 12px;
    box-shadow: var(--shadow);
    opacity: 0;
    transform: translate(-50%, -100%);
    transition: opacity 0.08s ease;
    white-space: nowrap;
    z-index: 5;
  }
  .chart-tooltip.show { opacity: 1; }
  .chart-tooltip .tt-label { color: var(--text-muted); font-size: 11px; margin-bottom: 2px; }
  .chart-tooltip .tt-value { color: var(--text-primary); font-weight: 700; font-size: 13.5px; }
  .chart-tooltip .tt-row { display: flex; align-items: center; gap: 6px; margin-top: 4px; }
  .chart-tooltip .tt-row:first-of-type { margin-top: 6px; }
  .chart-tooltip .tt-key { width: 10px; height: 2px; border-radius: 1px; display: inline-block; flex: none; }
  .chart-tooltip .tt-key-bar { width: 8px; height: 8px; border-radius: 2px; }
  .chart-tooltip .tt-val { color: var(--text-primary); font-weight: 700; font-size: 12.5px; }
  .chart-tooltip .tt-name { color: var(--text-muted); font-size: 11px; }
  .chart-tooltip .tt-note { color: var(--text-muted); font-size: 10.5px; font-style: italic; margin-top: 4px; white-space: normal; max-width: 180px; }
  .chart-card { position: relative; }

  /* ---------- Week navigator ---------- */
  .week-nav {
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 6px;
    width: fit-content;
    margin: 0 auto 36px;
    background: var(--surface-1);
    border: 1px solid var(--border);
    border-radius: 100px;
    padding: 6px 8px;
    box-shadow: var(--shadow);
  }
  .week-nav-btn {
    background: none;
    border: none;
    width: 28px; height: 28px;
    border-radius: 50%;
    font-size: 15px;
    color: var(--text-secondary);
    cursor: pointer;
    display: flex; align-items: center; justify-content: center;
    flex: none;
  }
  .week-nav-btn:hover:not(:disabled) { background: var(--gridline); color: var(--text-primary); }
  .week-nav-btn:disabled { opacity: 0.3; cursor: default; }
  .week-nav-select {
    border: none;
    background: none;
    font-size: 13.5px;
    font-weight: 600;
    color: var(--text-primary);
    cursor: pointer;
    padding: 4px 4px;
    font-family: inherit;
    -webkit-appearance: none;
    appearance: none;
    text-align: center;
    max-width: 220px;
  }
  .week-nav-select:focus-visible { outline: 2px solid var(--series-followers); outline-offset: 2px; border-radius: 4px; }
  .week-nav-latest-badge {
    font-size: 10px;
    font-weight: 700;
    color: var(--success);
    border: 1px solid var(--success);
    padding: 2px 7px;
    border-radius: 100px;
    margin-right: 2px;
    white-space: nowrap;
  }
  /* ---------- No-photo fallback post card (missing image data) ---------- */
  .post-thumb-empty {
    aspect-ratio: 1 / 1;
    border-radius: 10px;
    border: 1px dashed var(--border);
    background: var(--surface-1);
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 14px;
    text-align: center;
  }
  .post-thumb-empty .cap-text {
    font-size: 12.5px;
    line-height: 1.4;
    color: var(--text-secondary);
  }
  .share-badge-inline {
    display: inline-block;
    margin-top: 8px;
    padding: 3px 9px;
    border-radius: 100px;
    font-size: 11px;
    font-weight: 700;
    color: var(--text-primary);
    background: var(--gridline);
  }

  /* ---------- Insights callout ---------- */
  .insights {
    margin-top: 16px;
    background: var(--surface-1);
    border: 1px solid var(--border);
    border-left: 3px solid var(--series-followers);
    border-radius: 10px;
    padding: 16px 18px;
    box-shadow: var(--shadow);
  }
  .insights .insights-label {
    font-size: 11px;
    font-weight: 700;
    letter-spacing: 0.06em;
    text-transform: uppercase;
    color: var(--text-muted);
    margin: 0 0 8px;
  }
  .insights p {
    margin: 0 0 8px;
    font-size: 14px;
    line-height: 1.55;
    color: var(--text-primary);
  }
  .insights p:last-child { margin-bottom: 0; }

  /* ---------- Posts gallery ---------- */
  .post-grid {
    display: grid;
    grid-template-columns: repeat(3, 1fr);
    gap: 10px;
  }
  @media (max-width: 720px) {
    .post-grid { grid-template-columns: repeat(2, 1fr); }
  }
  .post-card {
    display: flex;
    flex-direction: column;
    gap: 8px;
  }
  .post-thumb {
    position: relative;
    aspect-ratio: 1 / 1;
    border-radius: 10px;
    overflow: hidden;
    border: 1px solid var(--border);
    background: var(--surface-1);
    padding: 0;
    display: block;
    width: 100%;
  }
  .post-thumb img {
    width: 100%; height: 100%;
    object-fit: cover;
    display: block;
  }
  .post-thumb .post-cap {
    position: absolute;
    left: 0; right: 0; bottom: 0;
    padding: 16px 10px 8px;
    font-size: 11.5px;
    line-height: 1.35;
    color: #fff;
    background: linear-gradient(to top, rgba(0,0,0,0.75) 25%, rgba(0,0,0,0));
    text-align: left;
    display: -webkit-box;
    -webkit-line-clamp: 2;
    -webkit-box-orient: vertical;
    overflow: hidden;
  }

  /* ---------- Per-post stats row ---------- */
  .post-stats {
    display: flex;
    flex-wrap: wrap;
    column-gap: 12px;
    row-gap: 4px;
    padding: 0 1px;
  }
  .post-stat {
    display: inline-flex;
    align-items: center;
    gap: 4px;
    font-size: 11.5px;
    color: var(--text-muted);
    white-space: nowrap;
  }
  .post-stat svg {
    width: 12px;
    height: 12px;
    flex: none;
    stroke: currentColor;
    fill: none;
  }

  /* ---------- Top shared posts (variant of post-grid) ---------- */
  .shared-grid { grid-template-columns: repeat(4, 1fr); }
  @media (max-width: 720px) {
    .shared-grid { grid-template-columns: repeat(2, 1fr); }
  }
  .share-badge {
    position: absolute;
    top: 8px; right: 8px;
    padding: 3px 8px;
    border-radius: 100px;
    font-size: 11px;
    font-weight: 700;
    color: #fff;
    background: rgba(0,0,0,0.6);
    backdrop-filter: blur(2px);
    letter-spacing: 0.02em;
  }
  .share-badge svg { width: 10px; height: 10px; vertical-align: -1px; margin-right: 3px; }

  /* ---------- Upcoming list ---------- */
  .upcoming-card {
    background: var(--surface-1);
    border: 1px solid var(--border);
    border-radius: 12px;
    padding: 18px 20px;
    box-shadow: var(--shadow);
    display: grid;
    grid-template-columns: repeat(2, 1fr);
    gap: 20px 32px;
  }
  @media (max-width: 720px) {
    .upcoming-card { grid-template-columns: 1fr; }
  }
  .upcoming-group { min-width: 0; }
  .upcoming-category {
    font-size: 12px;
    font-weight: 700;
    letter-spacing: 0.04em;
    text-transform: uppercase;
    color: var(--text-muted);
    margin: 0 0 8px;
    padding-bottom: 6px;
    border-bottom: 1px solid var(--border);
  }
  .upcoming-list {
    margin: 0;
    padding-left: 20px;
  }
  .upcoming-list li {
    font-size: 14.5px;
    line-height: 1.6;
    margin-bottom: 8px;
    color: var(--text-primary);
  }
  .upcoming-list li:last-child { margin-bottom: 0; }
  .upcoming-list li .item-date {
    color: var(--text-muted);
    font-size: 12.5px;
    margin-left: 6px;
  }
  .upcoming-empty {
    color: var(--text-muted);
    font-size: 14px;
    grid-column: 1 / -1;
  }

  footer.page-foot {
    margin-top: 56px;
    padding-top: 20px;
    border-top: 1px solid var(--border);
    font-size: 12px;
    color: var(--text-muted);
    display: flex;
    justify-content: space-between;
    flex-wrap: wrap;
    gap: 8px;
  }

  .sr-only {
    position: absolute; width: 1px; height: 1px;
    padding: 0; margin: -1px; overflow: hidden;
    clip: rect(0,0,0,0); white-space: nowrap; border: 0;
  }
</style>
</head>
<body>

<div class="wrap">

  <header class="page-head">
    <div class="brand-block">
      <p class="eyebrow" id="brandEyebrow">Social Performance</p>
      <h1 id="brandTitle">Repeal Day</h1>
      <p class="sub">Instagram — weekly performance snapshot</p>
    </div>
    <div class="as-of" id="asOfLine"></div>
  </header>

  <!-- ============ WEEK NAVIGATOR (governs KPI cards / Posts / Top Shared / Upcoming below) ============ -->
  <div class="week-nav" id="weekNav">
    <button class="week-nav-btn" id="weekPrevBtn" type="button" aria-label="Previous week">‹</button>
    <span class="week-nav-latest-badge" id="weekLatestBadge" hidden>Latest</span>
    <select class="week-nav-select" id="weekSelect" aria-label="Select week"></select>
    <button class="week-nav-btn" id="weekNextBtn" type="button" aria-label="Next week">›</button>
  </div>

  <!-- ============ SECTION 1: PERFORMANCE ============ -->
  <section class="block" id="section-performance">
    <p class="block-title">Performance</p>

    <div class="kpi-row" id="kpiRow"></div>

    <div class="chart-grid" id="chartGrid">
      <div class="chart-card">
        <p class="chart-title">Performance trends</p>
        <p class="chart-sub" id="trendsSub"></p>
        <div class="chart-legend" id="trendsLegend"></div>
        <div class="chart-scroll"><div id="chart-trends"></div><div class="scroll-hint">›</div></div>

        <p class="mini-table-label">Last 3 months</p>
        <table class="data-table open" id="table-last3">
          <thead><tr id="table-last3-head"></tr></thead>
          <tbody id="table-last3-body"></tbody>
        </table>

        <div class="chart-foot"><button class="table-toggle" data-target="table-full-history">View full history as table</button></div>
        <div class="table-scroll">
          <table class="data-table" id="table-full-history">
            <thead><tr><th>Month</th><th>Total followers</th><th>Unfollows</th><th>Cost per follow</th></tr></thead>
            <tbody></tbody>
          </table>
        </div>
      </div>
    </div>

    <div class="insights" id="insights-performance" hidden>
      <p class="insights-label">Insights</p>
      <div id="insights-performance-body"></div>
    </div>
  </section>

  <!-- ============ SECTION 2: ORGANIC POSTS ============ -->
  <section class="block" id="section-posts">
    <p class="block-title">Organic posts</p>
    <div class="post-grid" id="postGrid"></div>
    <div class="insights" id="insights-posts" hidden>
      <p class="insights-label">Insights</p>
      <div id="insights-posts-body"></div>
    </div>
  </section>

  <!-- ============ SECTION 2b: TOP SHARED POSTS ============ -->
  <section class="block" id="section-shared">
    <p class="block-title">Top shared posts <span>— trailing 30 days</span></p>
    <div class="post-grid shared-grid" id="sharedGrid"></div>
    <div class="insights" id="insights-shared" hidden>
      <p class="insights-label">Insights</p>
      <div id="insights-shared-body"></div>
    </div>
  </section>

  <!-- ============ SECTION 3: UPCOMING ============ -->
  <section class="block" id="section-upcoming">
    <p class="block-title">Upcoming <span id="upcomingWeekOf"></span></p>
    <div class="upcoming-card" id="upcomingCard"></div>
    <div class="insights" id="insights-upcoming" hidden>
      <p class="insights-label">Insights</p>
      <div id="insights-upcoming-body"></div>
    </div>
  </section>

  <footer class="page-foot">
    <span id="footerClient"></span>
    <span id="footerUpdated"></span>
  </footer>

</div>

<script>
/* =====================================================================
   DATA
   ---------------------------------------------------------------------
   This is the only block that changes on a weekly update.

   - monthly: one row per calendar month. Drives the trend chart and both
     tables (Last-3-months and full history) — these are NOT affected by
     the week navigator below; they always show the latest 12 months / 3
     months / full run, same every week (confirmed with Taryn 2026-09-01 —
     the trend chart doesn't need a week-by-week view, only the KPI cards
     do). When a month closes, its row is final and a new row is appended
     for the next month — never delete old rows.

   - weeks: one entry per weekly update, OLDEST FIRST (so the last entry is
     always the current/latest week — same convention as `monthly`). Each
     entry is a full snapshot of EVERYTHING that DOES change week to week —
     the KPI cards, Organic Posts, Top Shared Posts, Upcoming, and all four
     Insights blocks. The week navigator (see the JS "Week navigator"
     section below) steps through this array and re-renders all of it from
     one control.
       - weekOf: ISO date string, used as a stable key (e.g. "2026-08-31").
       - weekLabel: display string shown in the nav dropdown and headings
         (e.g. "Week of Aug 31, 2026").
       - kpis: { totalFollowers, paidFollowers, organicFollowers,
         paidImpressions } — that week's snapshot for the 4 KPI cards up
         top. Diffed against the PREVIOUS WEEK's kpis (not the previous
         month) to compute each card's delta — labeled "vs last week". The

  /* ===================== Helpers ===================== */
  function compactNumber(n) {
    if (Math.abs(n) >= 1000000) return (n / 1000000).toFixed(1).replace(/\.0$/, "") + "M";
    if (Math.abs(n) >= 1000) return (n / 1000).toFixed(1).replace(/\.0$/, "") + "K";
    return String(Math.round(n));
  }
  function fullNumber(n) { return Math.round(n).toLocaleString("en-US"); }
  function currency(n) { return "$" + n.toFixed(2); }
  function percent(n) { return n.toFixed(1) + "%"; }
  function signed(n, formatter) {
    const s = formatter(Math.abs(n));
    return (n > 0 ? "+" : n < 0 ? "−" : "") + s;
  }
  function el(tag, cls, text) {
    const e = document.createElement(tag);
    if (cls) e.className = cls;
    if (text !== undefined) e.textContent = text;
    return e;
  }

  months.forEach((d, i) => {
    if (i === 0) return;
    d.followersGained = d.totalFollowers - months[i - 1].totalFollowers;
    d.unfollowPct = d.followersGained > 0 ? (d.unfollows / d.followersGained) * 100 : null;
  });

  const kpiDefs = [
    { key: "totalFollowers", label: "Instagram followers", format: compactNumber },
    { key: "paidFollowers",  label: "Paid followers",      format: compactNumber },
    { key: "organicFollowers", label: "Organic followers", format: compactNumber },
    { key: "paidImpressions", label: "Paid impressions",   format: compactNumber }
  ];

  // Renders the KPI row from the SELECTED WEEK's own `kpis` snapshot, diffed
  // against the previous week's `kpis` (prevKpis, null for the very first
  // week on record — same "no prior period to diff against" pattern used
  // for `months` above). Called from renderAll() every time the navigator
  // changes: these numbers move week to week, unlike the trend chart and
  // tables below (which stay on the monthly cadence and don't respond to
  // the navigator — see "Performance trends" below).
  function renderKPIs(kpis, prevKpis) {
    const kpiRow = document.getElementById("kpiRow");
    kpiRow.innerHTML = "";
    kpiDefs.forEach(def => {
      const tile = el("div", "stat-tile");
      tile.appendChild(el("p", "label", def.label));
      tile.appendChild(el("p", "value", def.format(kpis[def.key])));
      if (prevKpis) {
        const delta = kpis[def.key] - prevKpis[def.key];
        const pct = prevKpis[def.key] !== 0 ? (delta / prevKpis[def.key]) * 100 : 0;
        const deltaEl = el("span", "delta " + (delta >= 0 ? "up" : "down"));
        deltaEl.textContent = signed(delta, compactNumber) + " (" + signed(pct, v => v.toFixed(1) + "%") + ")";
        const period = el("span", "delta-period", "vs last week");
        deltaEl.appendChild(period);
        tile.appendChild(deltaEl);
      }
      kpiRow.appendChild(tile);
    });
  }

  /* ===================== Chart engine (hand-rolled SVG) ===================== */
  const NS = "http://www.w3.org/2000/svg";
  function svgEl(tag, attrs) {
    const e = document.createElementNS(NS, tag);
    for (const k in attrs) e.setAttribute(k, attrs[k]);
    return e;
  }
  function niceMax(max) {
    if (max <= 0) return 1;
    const mag = Math.pow(10, Math.floor(Math.log10(max)));
    const norm = max / mag;
    let step;
    if (norm <= 1) step = 1;
    else if (norm <= 2) step = 2;
    else if (norm <= 5) step = 5;
    else step = 10;
    return step * mag;
  }

  function drawComboChart(containerId, opts) {
    // opts: { data, bar: {key,label,color,valueFormat,axisFormat}, line: {key,label,color,valueFormat,axisFormat},
    //         annotations?: [{ i, label }] }
    // Classic dual-axis combo: bar metric on the left axis, line metric on the
    // right axis, each on its own real-number scale starting at zero (no
    // truncated axis) so the two aren't stretched to manufacture a correlation.
    // Axis ticks and titles are color-coded to their series so it's always
    // clear which numbers belong to which line/bars.
    //
    // `annotations` flags specific data points as one-off outliers with a known
    // real-world cause (e.g. a paid-spend pause) rather than a trend to scale
    // the axis around: those points are excluded when sizing the line axis, so
    // one anomaly doesn't compress every other month into an unreadable band.
    // The flagged point still renders — clamped to the top of the plot, drawn
    // with a distinct open marker + up-chevron so it doesn't read as a normal
    // value — and its real number is still exact in the tooltip and `label`.
    const container = document.getElementById(containerId);
    const availW = (container.closest(".chart-scroll") || container).clientWidth || 900;
    const padL = 52, padR = 56, padT = 26, padB = 30;
    // Leave room for both axes' padding when spacing points, so a chart that
    // can fit without scrolling actually does — only clamp to the 56-110 comfort
    // range (and let it scroll, via .chart-scroll) when there's truly not enough room.
    const pointGap = Math.max(56, Math.min(110, (availW - padL - padR) / Math.max(opts.data.length - 1, 1)));
    const plotW = pointGap * (opts.data.length - 1 || 1);
    const width = Math.max(plotW + padL + padR, 320);
    const height = 240;
    const plotH = height - padT - padB;

    const annotations = opts.annotations || [];
    const annotatedIdx = new Set(annotations.map(a => a.i));

    const yMaxBar = niceMax(Math.max(...opts.data.map(d => d[opts.bar.key]), 0) * 1.15 || 1);
    const yMaxLine = opts.line.axisMax || niceMax(
      Math.max(...opts.data.filter((d, i) => !annotatedIdx.has(i)).map(d => d[opts.line.key]), 0) * 1.15 || 1
    );

    function xAt(i) { return padL + (opts.data.length === 1 ? plotW / 2 : i * pointGap); }
    function yBar(v) { return padT + plotH - (v / yMaxBar) * plotH; }
    function yLine(v) { return padT + plotH - (Math.min(v, yMaxLine) / yMaxLine) * plotH; }

    const svg = svgEl("svg", {
      viewBox: "0 0 " + width + " " + height,
      width: width, height: height,
      role: "img",
      "aria-label": opts.bar.label + " (left axis) vs " + opts.line.label + " (right axis) chart"
    });

    // gridlines at 4 shared steps — labeled independently on each axis
    const steps = 4;
    for (let s = 0; s <= steps; s++) {
      const f = s / steps;
      const y = padT + plotH - f * plotH;
      svg.appendChild(svgEl("line", { x1: padL, x2: width - padR, y1: y, y2: y, stroke: "var(--gridline)", "stroke-width": 1 }));
      const lt = svgEl("text", { x: padL - 8, y: y + 4, "text-anchor": "end", "font-size": 10, fill: opts.bar.color });
      lt.textContent = (opts.bar.axisFormat || compactNumber)(f * yMaxBar);
      svg.appendChild(lt);
      const rt = svgEl("text", { x: width - padR + 8, y: y + 4, "text-anchor": "start", "font-size": 10, fill: opts.line.color });
      rt.textContent = (opts.line.axisFormat || compactNumber)(f * yMaxLine);
      svg.appendChild(rt);
    }
    // baseline
    svg.appendChild(svgEl("line", { x1: padL, x2: width - padR, y1: yBar(0), y2: yBar(0), stroke: "var(--baseline)", "stroke-width": 1 }));

    // axis titles, color-matched to each series
    const barTitle = svgEl("text", { x: padL, y: 12, "text-anchor": "start", "font-size": 10, "font-weight": 700, fill: opts.bar.color });
    barTitle.textContent = opts.bar.label;
    svg.appendChild(barTitle);
    const lineTitle = svgEl("text", { x: width - padR, y: 12, "text-anchor": "end", "font-size": 10, "font-weight": 700, fill: opts.line.color });
    lineTitle.textContent = opts.line.label;
    svg.appendChild(lineTitle);

    // x labels
    opts.data.forEach((d, i) => {
      const t = svgEl("text", { x: xAt(i), y: height - 8, "text-anchor": "middle", "font-size": 10, fill: "var(--text-muted)" });
      t.textContent = d.label;
      svg.appendChild(t);
    });

    // bars (left axis)
    const barW = Math.min(24, pointGap * 0.5);
    opts.data.forEach((d, i) => {
      const x = xAt(i), y = yBar(d[opts.bar.key]);
      const h = yBar(0) - y;
      svg.appendChild(svgEl("rect", { x: x - barW / 2, y: y, width: barW, height: Math.max(h, 0), rx: 4, ry: 4, fill: opts.bar.color }));
    });

    // line + dots (right axis)
    let dLine = "";
    opts.data.forEach((d, i) => {
      const x = xAt(i), y = yLine(d[opts.line.key]);
      dLine += (i === 0 ? "M" : "L") + x + " " + y + " ";
    });
    svg.appendChild(svgEl("path", { d: dLine, fill: "none", stroke: opts.line.color, "stroke-width": 2, "stroke-linejoin": "round", "stroke-linecap": "round" }));
    opts.data.forEach((d, i) => {
      const x = xAt(i), y = yLine(d[opts.line.key]);
      const clipped = d[opts.line.key] > yMaxLine;
      if (clipped) {
        // Off-scale on purpose (see annotations above): an open ring instead of
        // a filled dot, plus a small up-chevron, so it reads as "goes higher"
        // rather than "the value really is the axis max."
        svg.appendChild(svgEl("circle", { cx: x, cy: y, r: 4, fill: "var(--surface-1)", stroke: opts.line.color, "stroke-width": 2 }));
        svg.appendChild(svgEl("path", {
          d: "M " + (x - 4) + " " + (y - 5) + " L " + x + " " + (y - 11) + " L " + (x + 4) + " " + (y - 5),
          fill: "none", stroke: opts.line.color, "stroke-width": 2, "stroke-linecap": "round", "stroke-linejoin": "round"
        }));
      } else {
        svg.appendChild(svgEl("circle", { cx: x, cy: y, r: i === opts.data.length - 1 ? 4 : 3, fill: opts.line.color, stroke: "var(--surface-1)", "stroke-width": 2 }));
      }
    });

    // annotation labels — short, muted, italic captions pinned above specific
    // points (e.g. flagging a known real-world cause for an outlier)
    annotations.forEach(a => {
      const d = opts.data[a.i];
      if (!d) return;
      const x = xAt(a.i);
      const pointY = yLine(d[opts.line.key]);
      const labelY = Math.max(pointY - 16, padT + 10);
      const label = svgEl("text", { x: x, y: labelY, "text-anchor": "middle", "font-size": 9, "font-style": "italic", fill: "var(--text-muted)" });
      label.textContent = a.label;
      svg.appendChild(label);
    });

    // crosshair + hit layer
    const crosshair = svgEl("line", { x1: 0, x2: 0, y1: padT, y2: height - padB, stroke: "var(--text-muted)", "stroke-width": 1, opacity: 0 });
    svg.appendChild(crosshair);

    const hitRect = svgEl("rect", { x: padL, y: padT, width: plotW || width, height: plotH, fill: "transparent" });
    svg.appendChild(hitRect);

    container.innerHTML = "";
    container.appendChild(svg);

    // tooltip element (one per chart card)
    const card = container.closest(".chart-card");
    let tooltip = card.querySelector(".chart-tooltip");
    if (!tooltip) {
      tooltip = el("div", "chart-tooltip");
      card.appendChild(tooltip);
    }

    function showTooltip(i) {
      const d = opts.data[i];
      const x = xAt(i);
      crosshair.setAttribute("x1", x); crosshair.setAttribute("x2", x);
      crosshair.setAttribute("opacity", 1);
      const rectBounds = container.getBoundingClientRect();
      const scale = rectBounds.width / width;
      tooltip.style.left = (x * scale) + "px";
      tooltip.style.top = (Math.min(yBar(d[opts.bar.key]), yLine(d[opts.line.key])) - 12) + "px";
      tooltip.innerHTML = "";
      tooltip.appendChild(el("div", "tt-label", d.label + " " + d.month.slice(0, 4)));
      const barRow = el("div", "tt-row");
      const barKey = document.createElement("span");
      barKey.className = "tt-key tt-key-bar";
      barKey.style.background = opts.bar.color;
      barRow.appendChild(barKey);
      barRow.appendChild(el("span", "tt-val", (opts.bar.valueFormat || compactNumber)(d[opts.bar.key])));
      barRow.appendChild(el("span", "tt-name", opts.bar.label));
      tooltip.appendChild(barRow);
      const lineRow = el("div", "tt-row");
      const lineKey = document.createElement("span");
      lineKey.className = "tt-key";
      lineKey.style.background = opts.line.color;
      lineRow.appendChild(lineKey);
      lineRow.appendChild(el("span", "tt-val", (opts.line.valueFormat || compactNumber)(d[opts.line.key])));
      lineRow.appendChild(el("span", "tt-name", opts.line.label));
      tooltip.appendChild(lineRow);
      const ann = annotations.find(a => a.i === i);
      if (ann) tooltip.appendChild(el("div", "tt-note", ann.label + " — real value shown above, chart axis capped."));
      tooltip.classList.add("show");
    }
    function hideTooltip() {
      tooltip.classList.remove("show");
      crosshair.setAttribute("opacity", 0);
    }

    function nearestIndex(clientX) {
      const rect = hitRect.getBoundingClientRect();
      const relX = clientX - rect.left;
      const scale = rect.width / (plotW || width);
      let best = 0, bestD = Infinity;
      opts.data.forEach((d, i) => {
        const px = (xAt(i) - padL) * scale;
        const dist = Math.abs(px - relX);
        if (dist < bestD) { bestD = dist; best = i; }
      });
      return best;
    }

    hitRect.addEventListener("pointermove", (e) => showTooltip(nearestIndex(e.clientX)));
    hitRect.addEventListener("pointerleave", hideTooltip);
    hitRect.addEventListener("pointerdown", (e) => showTooltip(nearestIndex(e.clientX)));

    // scroll hint — only shown when there's genuinely more to scroll to
    const scrollWrap = container.closest(".chart-scroll");
    const hint = scrollWrap ? scrollWrap.querySelector(".scroll-hint") : null;
    function syncHint() {
      if (!hint) return;
      const overflowing = scrollWrap.scrollWidth - scrollWrap.clientWidth > 4;
      const atEnd = scrollWrap.scrollLeft + scrollWrap.clientWidth >= scrollWrap.scrollWidth - 4;
      hint.classList.toggle("show", overflowing && !atEnd);
    }
    if (scrollWrap) {
      syncHint();
      scrollWrap.addEventListener("scroll", syncHint);
      window.addEventListener("resize", syncHint);
    }
  }

  // Total followers, unfollows, and CPF all live in the tables below. The chart
  // itself pairs two different, derived metrics: net followers gained that
  // month (a rate of growth, not a cumulative total) against that same
  // month's unfollows expressed as a share of the gain — i.e. what portion of
  // the month's growth got clawed back. That's a more direct read on "is
  // growth slowing / how much is churn costing us" than CPF, which a raw
  // dollar figure doesn't land the same way for the client.
  const PERF_METRICS = [
    { key: "totalFollowers", label: "Total followers", color: "var(--series-followers)", valueFormat: fullNumber },
    { key: "unfollows",      label: "Unfollows",        color: "var(--series-unfollows)", valueFormat: fullNumber },
    { key: "cpf",            label: "Cost per follow",  color: "var(--series-cpf)",       valueFormat: currency, axisFormat: currency }
  ];
  const BAR_METRIC = { key: "followersGained", label: "Followers gained",        color: "var(--series-followers)", valueFormat: fullNumber };
  const LINE_METRIC = { key: "unfollowPct",    label: "Unfollows (% of gain)",   color: "var(--series-unfollows)", valueFormat: percent, axisFormat: percent };
  const latestMonth = months[months.length - 1];
  const chartMonths = months.slice(-12); // last 12 months so the dual-axis chart has room to breathe

  // June 2026's follower gain nearly stalled because of a paid-spend pause that
  // month, which drove Unfollows (% of gain) to a one-off ~66% — over 4x every
  // other month. Flagging it here excludes it from the right axis's scale (so
  // one anomaly doesn't compress the real trend) and labels it directly on the
  // chart; the true value is still exact in the tooltip.
  const CHART_ANNOTATIONS = [];
  const juneIdx = chartMonths.findIndex(d => d.month === "2026-06");
  if (juneIdx !== -1) CHART_ANNOTATIONS.push({ i: juneIdx, label: "Ad spend paused" });

  // This trend chart is deliberately NOT driven by the week navigator — it
  // always shows the latest 12 months, same as the full-history table below.
  // Confirmed with Taryn 2026-09-01: unlike the KPI cards (which change every
  // week), this graph doesn't need a week-by-week view. Rendered once, here.
  drawComboChart("chart-trends", { data: chartMonths, bar: BAR_METRIC, line: LINE_METRIC, annotations: CHART_ANNOTATIONS });

  document.getElementById("trendsSub").textContent =
    "Last 12 months · " + chartMonths[0].label + " " + chartMonths[0].month.slice(0, 4) +
    " – " + latestMonth.label + " " + latestMonth.month.slice(0, 4);

  // legend — square swatch for the bar metric, line swatch for the line metric,
  // mirroring each mark's actual shape
  const trendsLegend = document.getElementById("trendsLegend");
  [{ metric: BAR_METRIC, isBar: true }, { metric: LINE_METRIC, isBar: false }].forEach(({ metric, isBar }) => {
    const item = el("span", "legend-item");
    const sw = document.createElement("span");
    sw.className = isBar ? "swatch-bar" : "swatch";
    sw.style.background = metric.color;
    item.appendChild(sw);
    item.appendChild(document.createTextNode(metric.label));
    trendsLegend.appendChild(item);
  });

  // "Last 3 months" summary table — always the latest 3 months, same
  // not-navigator-driven reasoning as the chart above.
  const last3 = months.slice(-3);
  const last3Head = document.getElementById("table-last3-head");
  last3Head.appendChild(el("th", null, "Metric"));
  last3.forEach(d => last3Head.appendChild(el("th", null, d.label + " " + d.month.slice(0, 4))));
  const last3Body = document.getElementById("table-last3-body");
  PERF_METRICS.forEach(s => {
    const tr = document.createElement("tr");
    tr.appendChild(el("td", null, s.label));
    last3.forEach(d => tr.appendChild(el("td", null, s.valueFormat(d[s.key]))));
    last3Body.appendChild(tr);
  });

  // Full-history table — the accessible twin of the chart (plus unfollows), tucked
  // behind a toggle. Always the complete run regardless of the selected week —
  // this is the permanent record, not an "as of" snapshot, so it doesn't move
  // with the navigator (per the "never delete old rows" convention below).
  const fullHistoryBody = document.querySelector("#table-full-history tbody");
  months.forEach(d => {
    const tr = document.createElement("tr");
    tr.appendChild(el("td", null, d.label + " " + d.month.slice(0, 4)));
    PERF_METRICS.forEach(s => tr.appendChild(el("td", null, s.valueFormat(d[s.key]))));
    fullHistoryBody.appendChild(tr);
  });

  // table toggles
  document.querySelectorAll(".table-toggle").forEach(btn => {
    btn.addEventListener("click", () => {
      const t = document.getElementById(btn.dataset.target);
      const open = t.classList.toggle("open");
      btn.textContent = open ? "Hide table" : "View as table";
    });
  });

  /* ===================== Insights ===================== */
  // All four sections' Insights are week-scoped now — renderAll() calls this
  // with the selected week's insights text (all four are week-scoped now)
  // every time the navigator changes.
  function renderInsights(sectionKey, text) {
    text = text || "";
    const wrap = document.getElementById("insights-" + sectionKey);
    const body = document.getElementById("insights-" + sectionKey + "-body");
    if (!text.trim()) { wrap.hidden = true; return; }
    wrap.hidden = false;
    body.innerHTML = "";
    text.split(/\n{2,}/).forEach(para => {
      body.appendChild(el("p", null, para.trim()));
    });
  }

  /* ===================== Post galleries ===================== */
  function captionOf(p) { return p.date ? (p.date + " · " + p.caption) : p.caption; }

  // Static, hand-authored icon markup (not user data) — safe to set via innerHTML.
  const STAT_ICONS = {
    views: '<svg viewBox="0 0 16 16" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><path d="M1 8s2.6-5 7-5 7 5 7 5-2.6 5-7 5-7-5-7-5Z"/><circle cx="8" cy="8" r="1.8"/></svg>',
    likes: '<svg viewBox="0 0 16 16" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><path d="M8 13.4S1.6 9.7 1.6 5.7c0-2 1.6-3.6 3.6-3.6 1.2 0 2.3.6 2.8 1.6.5-1 1.6-1.6 2.8-1.6 2 0 3.6 1.6 3.6 3.6 0 4-6.4 7.7-6.4 7.7Z"/></svg>',
    shares: '<svg viewBox="0 0 16 16" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><path d="M4 11 11 4M11 4H6.5M11 4v4.5"/></svg>',
    comments: '<svg viewBox="0 0 16 16" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><path d="M2 3h12v7.5H6.3L3 13.5v-3H2Z"/></svg>',
    saves: '<svg viewBox="0 0 16 16" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><path d="M4 2h8v12l-4-3.2L4 14V2Z"/></svg>'
  };
  const STAT_ORDER = [
    ["views", "views"],
    ["likes", "likes"],
    ["shares", "shares"],
    ["comments", "comments"],
    ["saves", "saves"]
  ];

  function statsRowFor(stats) {
    if (!stats) return null;
    const row = document.createElement("div");
    row.className = "post-stats";
    let any = false;
    STAT_ORDER.forEach(([key, label]) => {
      if (typeof stats[key] !== "number") return;
      any = true;
      const item = document.createElement("span");
      item.className = "post-stat";
      item.setAttribute("aria-label", compactNumber(stats[key]) + " " + label);
      item.innerHTML = STAT_ICONS[key];
      item.appendChild(document.createTextNode(compactNumber(stats[key])));
      row.appendChild(item);
    });
    return any ? row : null;
  }

  function renderPostGrid(containerId, items, opts) {
    opts = opts || {};
    const grid = document.getElementById(containerId);
    grid.innerHTML = "";
    if (!items || items.length === 0) {
      grid.innerHTML = '<p class="upcoming-empty">No posts added yet.</p>';
      return;
    }
    items.forEach((p) => {
      const card = document.createElement("div");
      card.className = "post-card";

      // Every week keeps its real photos (no archiving) — this fallback only
      // covers a genuinely missing image value (e.g. a placeholder not yet
      // swapped in), so the card still shows the caption/stats instead of a
      // broken thumbnail. Thumbnails are plain (non-clickable) — no
      // click-to-enlarge; the embedded image only needs to read well at
      // thumbnail size.
      if (!p.image) {
        card.classList.add("no-photo");
        const empty = document.createElement("div");
        empty.className = "post-thumb-empty";
        const inner = document.createElement("div");
        const capText = el("div", "cap-text", captionOf(p));
        inner.appendChild(capText);
        if (opts.showShares && typeof p.shares === "number") {
          inner.appendChild(el("div", "share-badge-inline", p.shares.toLocaleString() + " shares"));
        }
        empty.appendChild(inner);
        card.appendChild(empty);
      } else {
        const thumb = document.createElement("div");
        thumb.className = "post-thumb";
        const img = document.createElement("img");
        img.src = p.image;
        img.alt = p.caption;
        img.loading = "lazy";
        thumb.appendChild(img);
        if (opts.showShares && typeof p.shares === "number") {
          thumb.appendChild(el("div", "share-badge", p.shares.toLocaleString() + " shares"));
        }
        thumb.appendChild(el("div", "post-cap", captionOf(p)));
        card.appendChild(thumb);
      }

      if (opts.showStats) {
        const statsRow = statsRowFor(p.stats);
        if (statsRow) card.appendChild(statsRow);
      }

      grid.appendChild(card);
    });
  }

  /* ===================== Upcoming ===================== */
  function renderUpcoming(upcoming) {
    const upcomingCard = document.getElementById("upcomingCard");
    upcomingCard.innerHTML = "";
    if (!upcoming || upcoming.length === 0) {
      upcomingCard.innerHTML = '<p class="upcoming-empty">Nothing scheduled right now.</p>';
      return;
    }
    upcoming.forEach(group => {
      const wrap = el("div", "upcoming-group");
      wrap.appendChild(el("p", "upcoming-category", group.category));
      const ul = el("ul", "upcoming-list");
      (group.items || []).forEach(item => {
        const li = document.createElement("li");
        if (typeof item === "string") {
          li.textContent = item;
        } else {
          li.textContent = item.text;
          if (item.date) li.appendChild(el("span", "item-date", item.date));
        }
        ul.appendChild(li);
      });
      wrap.appendChild(ul);
      upcomingCard.appendChild(wrap);
    });
  }

  /* ===================== Week navigator (drives KPIs + Posts/Shared/Upcoming/Insights) ===================== */
  // DATA.weeks is oldest-first; index (DATA.weeks.length - 1) is always the
  // current/latest week. One control, one renderAll(). Note this does NOT
  // touch the trend chart or the two Performance tables — those are static
  // (rendered once, above) since they're month-cadence and don't change
  // week to week; only the KPI cards do.
  function weekLabelOf(w) { return w.weekLabel || ("Week of " + w.weekOf); }

  const weekSelectEl = document.getElementById("weekSelect");
  const weekPrevBtn = document.getElementById("weekPrevBtn");
  const weekNextBtn = document.getElementById("weekNextBtn");
  const weekLatestBadge = document.getElementById("weekLatestBadge");

  // Dropdown lists most recent week first, since that's what people jump to
  // most — value is still the true index into DATA.weeks.
  for (let i = DATA.weeks.length - 1; i >= 0; i--) {
    const opt = document.createElement("option");
    opt.value = i;
    opt.textContent = weekLabelOf(DATA.weeks[i]);
    weekSelectEl.appendChild(opt);
  }

  let currentWeekIdx = DATA.weeks.length - 1;

  function renderAll(idx) {
    currentWeekIdx = Math.max(0, Math.min(idx, DATA.weeks.length - 1));
    const w = DATA.weeks[currentWeekIdx];
    const prevW = currentWeekIdx > 0 ? DATA.weeks[currentWeekIdx - 1] : null;
    const wi = w.insights || {};

    // KPI cards — this week vs last week
    renderKPIs(w.kpis, prevW ? prevW.kpis : null);
    renderInsights("performance", wi.performance);

    // Posts / Top Shared / Upcoming — that week's own data
    renderPostGrid("postGrid", w.posts, { showStats: true });
    renderPostGrid("sharedGrid", w.topShared, { showShares: true });
    renderUpcoming(w.upcoming);
    document.getElementById("upcomingWeekOf").textContent = "— " + weekLabelOf(w);
    renderInsights("posts", wi.posts);
    renderInsights("shared", wi.shared);
    renderInsights("upcoming", wi.upcoming);

    // Nav controls
    weekSelectEl.value = currentWeekIdx;
    weekPrevBtn.disabled = currentWeekIdx <= 0;
    weekNextBtn.disabled = currentWeekIdx >= DATA.weeks.length - 1;
    weekLatestBadge.hidden = currentWeekIdx !== DATA.weeks.length - 1;
  }

  weekSelectEl.addEventListener("change", (e) => renderAll(parseInt(e.target.value, 10)));
  weekPrevBtn.addEventListener("click", () => renderAll(currentWeekIdx - 1));
  weekNextBtn.addEventListener("click", () => renderAll(currentWeekIdx + 1));

  renderAll(DATA.weeks.length - 1);
</script>
</body>
</html>
